<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宴会仕込みノート</title>
<style>
:root{color-scheme:light;--ink:#20352c;--muted:#53665c;--line:#dbe4dc;--green:#205642;--paper:#f3f6f0}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.65 system-ui,sans-serif}
.wrap{width:min(1100px,calc(100% - 32px));margin-inline:auto}
header{background:#173c30;color:white;padding:30px 0 36px;border-bottom:5px solid #daaa62}
.brand{font-size:.875rem;font-weight:750;letter-spacing:.14em;color:#cde1ce;display:flex;align-items:center;gap:10px}
.brand span{display:grid;place-items:center;border:1px solid #80a896;border-radius:8px;width:30px;height:30px;color:#f7d8a3;letter-spacing:0}
h1{margin:10px 0 4px;font-size:clamp(1.75rem,4vw,2.8rem);letter-spacing:.04em;line-height:1.3}
header p{margin:0;color:#e1ece4}
main{display:grid;grid-template-columns:minmax(0, 360px) minmax(0, 1fr);gap:22px;padding:26px 0 42px;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:clamp(15px,3vw,25px);box-shadow:0 4px 14px #15332608;min-width:0}
h2{margin:0 0 15px;font-size:1.25rem}
label,summary{font-weight:700}
.field{display:grid;gap:6px;margin-top:15px;min-width:0}
input,select,button{font:inherit;width:100%;min-width:0;min-height:44px;border-radius:8px}
input,select{background:#fcfdfa;color:var(--ink);padding:7px 10px;border:1px solid #aabbb0}
select{appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--green) 50%),linear-gradient(135deg,var(--green) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}
input[type=range]{padding:0;margin:0;accent-color:var(--green)}
:focus-visible{outline:3px solid #99620a;outline-offset:3px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
details{border-top:1px solid var(--line);margin-top:18px;padding-top:12px}
summary{cursor:pointer;min-height:44px;padding:8px 0}
button{background:var(--green);border:0;color:white;font-weight:750;cursor:pointer;margin-top:18px}
button:hover{background:#173f30}
.deadline{background:#eef5ee;border:1px solid #d7e5d8;border-left:4px solid var(--green);border-radius:10px;padding:13px 15px;margin-bottom:20px}
.deadline.overdue{background:#fff3e6;border-color:#d39048}
.deadline strong{display:block;font-size:clamp(1.12rem,3vw,1.5rem);font-variant-numeric:tabular-nums}
.deadline p,.note,.meta{color:var(--muted);font-size:.875rem;margin:3px 0 0}
.meta{margin:-9px 0 16px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:10px 5px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
thead th{background:#f4f7f3;font-size:.875rem;color:var(--muted)}
td:last-child{color:var(--green);font-weight:750}
.note{margin-top:14px}
@media(max-width:740px){main{grid-template-columns:minmax(0,1fr);gap:14px;padding-top:16px}}
</style>
<header>
  <div class="wrap">
    <div class="brand"><span aria-hidden="true">宴</span> 団体予約の準備</div>
    <h1>宴会仕込みノート</h1>
    <p>予約ごとの仕込み量と、卸への発注締切を確認できます。</p>
  </div>
</header>
<main class="wrap">
  <form class="card" id="booking">
    <h2>予約内容</h2>
    <div class="field">
      <label for="people">人数（人）</label>
      <input id="people" type="number" inputmode="numeric" min="1" max="200" value="20" required>
      <input id="slider" type="range" min="1" max="200" value="20" aria-label="人数を調整">
    </div>
    <div class="field">
      <label for="course">コース</label>
      <select id="course">
        <option value="standard">定番コース</option>
        <option value="premium">ごちそうコース</option>
        <option value="vegetable">野菜中心コース</option>
      </select>
    </div>
    <div class="pair">
      <div class="field"><label for="date">予約日</label><input id="date" type="date" required></div>
      <div class="field"><label for="time">開始時刻</label><input id="time" type="time" value="18:00" required></div>
    </div>
    <details>
      <summary>発注条件を調整</summary>
      <div class="pair">
        <div class="field"><label for="days">何日前まで</label><input id="days" type="number" inputmode="numeric" min="0" max="30" value="2" required></div>
        <div class="field"><label for="cutoff">締切時刻</label><input id="cutoff" type="time" value="15:00" required></div>
      </div>
      <div class="field"><label for="closed">卸の休業日</label>
        <select id="closed">
          <option value="weekend">土・日</option><option value="sunday">日曜のみ</option><option value="none">なし</option>
        </select>
      </div>
      <p class="note">休業日に当たる場合は、直前の営業日に繰り上げます。祝日・臨時休業は手元の営業日程をご確認ください。</p>
    </details>
    <button type="submit">仕込み量・締切を確認</button>
  </form>
  <section class="card" aria-labelledby="result-title">
    <h2 id="result-title" tabindex="-1">仕込み・発注の目安</h2>
    <p class="meta" id="booking-summary" aria-live="polite"></p>
    <div id="results">
      <div class="deadline" id="deadline-box">
        <b>卸への発注締切</b>
        <strong id="deadline"></strong>
        <p id="rule"></p>
      </div>
      <table aria-label="食材ごとの仕込み量">
        <thead><tr><th scope="col">食材</th><th scope="col">1人分</th><th scope="col">仕込み量</th></tr></thead>
        <tbody id="ingredients"></tbody>
      </table>
      <p class="note">1人分はサンプルの配合です。仕込み量は人数分に予備5%を加え、1 g単位で切り上げています。</p>
    </div>
    <noscript>計算を行うには、ブラウザでJavaScriptを有効にしてください。</noscript>
  </section>
</main>
<script>
'use strict';

const recipes = {
  standard: [['鶏もも肉', 150], ['キャベツ', 65], ['じゃがいも', 90], ['きゅうり', 35], ['米（生）', 75]],
  premium: [['牛もも肉', 130], ['鯛（切り身）', 80], ['葉物野菜', 55], ['きのこ', 55], ['米（生）', 75]],
  vegetable: [['木綿豆腐', 130], ['かぼちゃ', 90], ['ブロッコリー', 65], ['きのこ', 55], ['米（生）', 75]]
};
const dayMs = 86400000;
const byId = id => document.getElementById(id);
const form = byId('booking');
const people = byId('people');
const slider = byId('slider');
const date = byId('date');
const course = byId('course');
const number = new Intl.NumberFormat('ja-JP', {maximumFractionDigits: 3});
const dateFormat = new Intl.DateTimeFormat('ja-JP', {
  timeZone: 'Asia/Tokyo', year: 'numeric', month: 'long', day: 'numeric', weekday: 'short'
});

function orderDeadline(reservationDate, reservationTime, leadDays, cutoffTime, closedDays) {
  const latest = Date.parse(reservationDate + 'T' + reservationTime + ':00+09:00');
  let deadline = Date.parse(reservationDate + 'T' + cutoffTime + ':00+09:00') - leadDays * dayMs;
  const closed = closedDays === 'weekend' ? [0, 6] : closedDays === 'sunday' ? [0] : [];
  while (deadline > latest || closed.includes(new Date(deadline + 9 * 3600000).getUTCDay())) {
    deadline -= dayMs;
  }
  return deadline;
}

function prepGrams(perPerson, guests) {
  return Math.ceil(perPerson * guests * 105 / 100);
}

function updateResults() {
  const summary = byId('booking-summary');
  const results = byId('results');
  results.hidden = Array.from(form.elements).some(field => !field.validity.valid);
  if (results.hidden) {
    summary.textContent = '入力内容を確認してください。人数は1〜200人、発注は0〜30日前から指定できます。';
    return;
  }

  const guests = people.valueAsNumber;
  const startTime = byId('time').value;
  const days = byId('days').valueAsNumber;
  const cutoff = byId('cutoff').value;
  const deadline = orderDeadline(date.value, startTime, days, cutoff, byId('closed').value);
  const overdue = deadline < Date.now();

  summary.textContent = dateFormat.format(Date.parse(date.value + 'T00:00:00+09:00')) +
    ' ' + startTime + ' ／ ' + guests + '人 ／ ' + course.selectedOptions[0].textContent;
  byId('deadline').textContent = dateFormat.format(deadline) + ' ' + cutoff + '（日本時間）';
  byId('deadline-box').classList.toggle('overdue', overdue);
  const lead = days === 0 ? '予約当日' : '予約の' + days + '日前';
  byId('rule').textContent = (overdue ? '締切を過ぎています。' : '') + '設定：' +
    lead + 'の' + cutoff + 'まで。予約開始後や休業日に当たる場合は前の営業日へ。';

  const rows = recipes[course.value].map(([name, grams]) => {
    const total = prepGrams(grams, guests);
    const row = document.createElement('tr');
    const label = document.createElement('th');
    label.scope = 'row';
    label.textContent = name;
    row.append(label);
    row.insertCell().textContent = grams + ' g';
    row.insertCell().textContent = total >= 1000 ? number.format(total / 1000) + ' kg' : total + ' g';
    return row;
  });
  byId('ingredients').replaceChildren(...rows);
}

date.value = new Date(Date.now() + (7 * 24 + 9) * 3600000).toISOString().slice(0, 10);
form.addEventListener('input', event => {
  if (event.target === slider) people.value = slider.value;
  if (event.target === people && people.validity.valid) slider.value = people.value;
  updateResults();
});
form.addEventListener('invalid', event => {
  const settings = event.target.closest('details');
  if (settings) settings.open = true;
}, true);
form.addEventListener('submit', event => {
  event.preventDefault();
  updateResults();
  byId('result-title').focus();
});
updateResults();
</script>
</html>
